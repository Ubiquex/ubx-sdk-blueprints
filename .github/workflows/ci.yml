name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ci-platform/go/go.mod

      - name: go build
        working-directory: ci-platform/go
        run: go build ./...

      - name: go test
        working-directory: ci-platform/go
        run: go test ./...
